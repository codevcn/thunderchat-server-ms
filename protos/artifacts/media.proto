syntax = "proto3";

package media;

service MediaService {
  rpc UploadFile(UploadFileRequest) returns (UploadFileResponse);
}

message UploadFileRequest {
  bytes content = 1;
}

message UploadFileResponse {
  int32 id = 1;
  string url = 2;
  string fileType = 3;
  string fileName = 4;
  optional string thumbnailUrl = 5;
  string fileSize = 6;
}
