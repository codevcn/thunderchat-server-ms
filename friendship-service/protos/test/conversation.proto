syntax = "proto3";

package conversation;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";


service MessageService {

  rpc FindMessagesForGlobalSearch(FindMessagesForGlobalSearchRequest) returns(FindMessagesForGlobalSearchResponse);
}


message FindMessagesForGlobalSearchRequest {
  repeated int32 ids = 1;
  int32 limit = 2;
}


message FindMessagesForGlobalSearchResponse {
  google.protobuf.Struct message = 1;
}
